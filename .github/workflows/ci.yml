name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    # 目标架构是 ARM64（地平线X3），用 GitHub 原生 ARM64 runner。
    # 若账号没有 ubuntu-24.04-arm，改成 ubuntu-latest（x86_64）仍能校验编译与自检。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 缓存第三方源码（googletest/OpenSSL/curl）
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/googletest
            fsd/3rdparty/openssl
            fsd/3rdparty/curl
          key: ota-3rdparty-${{ hashFiles('3rdparty/fetch.sh', 'fsd/3rdparty/fetch.sh') }}

      # 一键验证：拉取第三方源码 → 聚合构建 fsd/verify/agent/pack → ctest
      # （含 fsd_self_test 与 verify_self_test 两条 --self-test 底线）。
      - name: 一键验证（./scripts/verify.sh）
        run: ./scripts/verify.sh
