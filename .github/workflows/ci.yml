name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  fsd:
    # 鐩爣鏋舵瀯鏄?ARM64锛堝湴骞崇嚎X3锛夛紝鐢?GitHub 鍘熺敓 ARM64 runner锛?
    # 鑻ヨ处鍙锋病鏈?ubuntu-24.04-arm锛屾敼鎴?ubuntu-latest锛坸86_64锛変粛鑳芥牎楠岀紪璇戜笌鑷銆?
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: fsd
    steps:
      - uses: actions/checkout@v4

      - name: 缂撳瓨绗笁鏂规簮鐮侊紙OpenSSL/curl锛?
        uses: actions/cache@v4
        with:
          path: |
            fsd/3rdparty/openssl
            fsd/3rdparty/curl
          key: fsd-3rdparty-${{ hashFiles('fsd/3rdparty/fetch.sh') }}

      - name: 拉取第三方源码（缓存未命中时）
        run: bash ./3rdparty/fetch.sh

      - name: 閰嶇疆骞舵瀯寤?
        run: |
          cmake -S . -B build
          cmake --build build

      - name: 鏈湴鑷
        run: ./build/firmware_secure_download --self-test

  unit-tests:
    # 聚合构建 + GoogleTest 单元测试（pack / verify / fsd 移植测试 + 自检）。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 缓存第三方源码（googletest + fsd 的 OpenSSL/curl）
        uses: actions/cache@v4
        with:
          path: |
            3rdparty/googletest
            fsd/3rdparty/openssl
            fsd/3rdparty/curl
          key: unit-3rdparty-${{ hashFiles('3rdparty/fetch.sh', 'fsd/3rdparty/fetch.sh') }}

      - name: 拉取第三方源码（缓存未命中时）
        run: |
          bash ./3rdparty/fetch.sh
          (cd fsd && bash ./3rdparty/fetch.sh)

      - name: 配置并构建（聚合）
        run: |
          cmake -S . -B build
          cmake --build build

      - name: 单元测试（ctest + GoogleTest）
        run: ctest --test-dir build --output-on-failure
